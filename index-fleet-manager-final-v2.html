
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>电动车租赁商户管理端 · 首页</title>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',system-ui,sans-serif;background:#E8EAED;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#111}
.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}
.hid::-webkit-scrollbar{display:none}.hid{scrollbar-width:none}
.sl-enter-active,.sl-leave-active{transition:transform .28s cubic-bezier(.32,.72,0,1)}.sl-enter-from,.sl-leave-to{transform:translateX(100%)}
.fd-enter-active,.fd-leave-active{transition:opacity .25s}.fd-enter-from,.fd-leave-to{opacity:0}
.sh-enter-active,.sh-leave-active{transition:transform .3s cubic-bezier(.32,.72,0,1)}.sh-enter-from,.sh-leave-to{transform:translateY(100%)}
@keyframes spin{to{transform:rotate(360deg)}}.anim-spin{animation:spin 1s linear infinite}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:400px 100%;animation:shimmer 1.5s infinite;border-radius:4px}
.sk{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:400px 100%;animation:shimmer 1.5s infinite;border-radius:4px}
.filter-tabs{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;user-select:none;width:100%;flex-wrap:nowrap;white-space:nowrap;cursor:grab}
.filter-tabs::-webkit-scrollbar{display:none}.filter-tabs:active{cursor:grabbing}
.filter-pill{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0}
.item-enter-active{transition:all .35s cubic-bezier(.32,.72,0,1)}.item-enter-from{opacity:0;transform:translateY(12px)}
.toast-wrap{position:absolute;top:50px;left:16px;right:16px;z-index:99999;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.toast-item{padding:10px 20px;border-radius:12px;font-size:14px;font-weight:500;color:#fff;pointer-events:auto;backdrop-filter:blur(10px);text-align:center;max-width:80%;line-height:1.4}
.toast-success{background:rgba(23,163,74,.9)}.toast-error{background:rgba(220,38,38,.9)}.toast-info{background:rgba(47,111,235,.9)}.toast-warn{background:rgba(217,119,6,.9)}
.toast-enter-active{transition:all .3s cubic-bezier(.32,.72,0,1)}.toast-leave-active{transition:all .25s ease-in}
.toast-enter-from{opacity:0;transform:translateY(-20px) scale(.9)}.toast-leave-to{opacity:0;transform:translateY(-10px) scale(.95)}
input[type=date],select{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
.cb{width:20px;height:20px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid #E5E5E5;transition:all .15s}
.cb.on{background:#2F6FEB;border-color:#2F6FEB;color:#fff}.cb.pt{border-color:#2F6FEB;color:#2F6FEB;background:#fff}
.card-actions{display:flex;border-top:1px solid #E5E5E5;margin-top:0}
.card-action-btn{flex:1;padding:10px 0;font-size:13px;font-weight:600;text-align:center;cursor:pointer;user-select:none;transition:opacity .15s}
.card-action-btn:active{opacity:.8}
.card-action-btn + .card-action-btn{border-left:1px solid #E5E5E5}
.ptr-indicator{overflow:hidden;transition:height .2s;height:0;text-align:center;font-size:12px;color:#999;line-height:40px;flex-shrink:0}
.ptr-indicator .ptr-spinner{display:inline-block;width:16px;height:16px;border:2px solid #E5E5E5;border-top-color:#2F6FEB;border-radius:50%;vertical-align:middle;margin-right:6px;animation:ptr-spin .6s linear infinite}
@keyframes ptr-spin{to{transform:rotate(360deg)}}
.tab-fade-enter-active,.tab-fade-leave-active{transition:opacity .2s ease,transform .2s ease}
.tab-fade-enter-from{opacity:0;transform:translateY(6px)}
.tab-fade-leave-to{opacity:0;transform:translateY(-6px)}
.scan-frame{width:220px;height:220px;border:2px solid rgba(255,255,255,.6);border-radius:16px;position:relative;overflow:hidden}
.scan-line{position:absolute;left:4px;right:4px;height:2px;background:#2F6FEB;animation:scan-move 2s ease-in-out infinite}
@keyframes scan-move{0%{top:4px}50%{top:212px}100%{top:4px}}
</style>
</head>
<body>
<div id="app">
<div class="w-[393px] h-[852px] bg-black rounded-[55px] p-3 relative" style="box-shadow:0 0 0 2px #333,0 30px 60px rgba(0,0,0,.35)">
<div class="absolute top-[23px] left-1/2 -translate-x-1/2 w-[126px] h-[37px] bg-black rounded-[20px] z-[2000]"></div>
<div class="w-full h-full bg-[#F6F7F9] rounded-[44px] overflow-hidden flex flex-col relative">

<!-- ═══ Toast ═══ -->
<div class="toast-wrap"><transition-group name="toast"><div v-for="t in toasts" :key="t.id" class="toast-item" :class="'toast-'+t.type">{{ t.msg }}</div></transition-group></div>
<transition name="tab-fade" mode="out-in"><div :key="tab" class="flex-1 relative flex flex-col overflow-hidden">

<!-- ═══ HOME ═══ -->
<template v-if="tab==='home'">
<div class="pt-14 px-5 pb-3.5 bg-white shrink-0">
<div class="flex justify-between items-center">
<h1 class="text-[22px] font-bold tracking-[-.3px]">{{ store.name }}</h1>
<div class="flex gap-2.5">
<div class="w-9 h-9 rounded-full bg-[#F6F7F9] border border-[#E5E5E5] flex items-center justify-center cursor-pointer relative active:bg-[#E5E5E5]" @click="homeOpen('messages')">
<span v-html="luci('bell','w-[18px] h-[18px]')"></span>
<span v-if="unread>0" class="absolute -top-[3px] -right-[3px] min-w-[16px] h-[16px] rounded-full bg-[#DC2626] text-white text-[9px] font-bold flex items-center justify-center border-2 border-white px-[3px]">{{ unread }}</span>
</div>
</div>
</div>
<p class="text-xs text-[#6B6B6B] mt-1">{{ store.date }}</p>
</div>
<div class="ptr-indicator" id="ptr-home"><span class="ptr-text">下拉刷新</span></div>
<div id="sc-home" class="flex-1 overflow-y-auto min-h-0 px-5 pt-4 pb-24 hide-scroll" style="touch-action:pan-y;-webkit-overflow-scrolling:touch">
<div class="flex justify-between items-center mb-3"><span class="text-[15px] font-semibold">经营数据</span></div>
<div v-if="homeLoading" class="grid grid-cols-2 gap-2.5">
<div v-for="n in 4" :key="'bs'+n" class="bg-white border border-[#E5E5E5] rounded-xl p-4" style="box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)">
<div class="sk h-3 w-16 mb-3"></div><div class="sk h-6 w-24"></div>
</div>
</div>
<transition-group v-else name="item" tag="div" class="grid grid-cols-2 gap-2.5">
<div class="bg-white border border-[#E5E5E5] rounded-xl p-4" v-for="(s,i) in bizStats" :key="s.label" :style="{transitionDelay:i*60+'ms',boxShadow:'0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.06)'}">
<div class="text-xs text-[#6B6B6B] font-medium mb-2">{{ s.label }}</div>
<div class="flex items-baseline gap-2">
<span class="text-[22px] font-bold leading-none" style="font-variant-numeric:tabular-nums">{{ s.value }}</span>
<span v-if="s.trend" class="text-[11px] font-semibold px-1.5 py-0.5 rounded-[6px]" :class="s.trend>0?'text-[#17A34A] bg-[#ECFDF3]':'text-[#DC2626] bg-[#FEF2F2]'">{{ s.trend>0?'↑':'↓' }}{{ Math.abs(s.trend) }}%</span>
</div>
</div>
</transition-group>
<div class="flex justify-between items-center mb-3 mt-5"><span class="text-[15px] font-semibold">车辆运营</span></div>
<div v-if="homeLoading" class="grid grid-cols-2 gap-2.5">
<div v-for="n in 2" :key="'bv'+n" class="bg-white border border-[#E5E5E5] rounded-xl p-4" style="box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)">
<div class="sk h-3 w-16 mb-3"></div><div class="sk h-6 w-12"></div>
</div>
</div>
<transition-group v-else name="item" tag="div" class="grid grid-cols-2 gap-2.5">
<div class="bg-white border border-[#E5E5E5] rounded-xl p-4" v-for="(s,i) in vehStats" :key="s.label" :style="{transitionDelay:i*60+'ms',boxShadow:'0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.06)'}">
<div class="text-xs text-[#6B6B6B] font-medium mb-2">{{ s.label }}</div>
<span class="text-[22px] font-bold leading-none" :class="s.danger?'text-[#DC2626]':''">{{ s.value }}</span>
</div>
</transition-group>
<div class="flex justify-between items-center mb-3 mt-5">
<span class="text-[15px] font-semibold">最近告警</span>
<span class="flex items-center gap-0.5 text-sm text-[#2F6FEB] font-medium cursor-pointer select-none active:opacity-70" @click="homeOpen('alerts')">
全部<span v-html="luci('chevron-right','w-4 h-4')"></span>
</span>
</div>
<div v-if="homeLoading" class="bg-white border border-[#E5E5E5] rounded-xl overflow-hidden">
<div v-for="n in 3" :key="'ba'+n" class="flex items-center gap-3 px-4 py-3.5" :style="n<3?{borderBottom:'1px solid #E5E5E5'}:{}">
<div class="sk w-9 h-9 rounded-[10px] shrink-0"></div>
<div class="flex-1"><div class="sk h-3.5 w-28 mb-2"></div><div class="sk h-3 w-40"></div></div>
</div>
</div>
<div v-else-if="recent.length" class="bg-white border border-[#E5E5E5] rounded-xl overflow-hidden">
<transition-group name="item">
<div class="flex items-center gap-3 px-4 py-3.5 border-b border-[#E5E5E5] last:border-b-0" v-for="(a,i) in recent" :key="a.id" :style="{transitionDelay:i*80+'ms'}">
<div class="w-9 h-9 rounded-[10px] flex items-center justify-center shrink-0" :class="lvBg(a.lv)">
<span v-html="luci(a.icon,'w-[18px] h-[18px]')"></span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-semibold">{{ a.vin }}</span>
<span class="text-[11px] font-semibold px-2 py-0.5 rounded-[4px]" :class="lvBg(a.lv)">{{ a.type }}</span>
</div>
<div class="text-xs text-[#999]">告警时间：{{ a.time }}</div>
</div>
</div>
</transition-group>
</div>
<div v-else class="flex flex-col items-center py-10">
<div class="w-14 h-14 rounded-full bg-[#ECFDF3] flex items-center justify-center mb-3"><span v-html="luci('shield-check','w-7 h-7 text-[#17A34A]')"></span></div>
<div class="text-[15px] font-semibold text-[#111] mb-1">暂无告警</div>
<div class="text-[13px] text-[#999]">车辆运营状态良好，无需处理</div>
</div>
</div>
<transition name="sl">
<div v-if="homeOV==='alerts'" v-swipe-close="homeClose" class="absolute inset-0 bg-[#F6F7F9] z-[500] flex flex-col">
<div class="flex items-center pt-14 px-4 pb-3 bg-white shrink-0" style="border-bottom:1px solid #E5E5E5">
<div class="w-8 h-8 rounded-full flex items-center justify-center cursor-pointer text-[#2F6FEB] active:bg-[#EBF1FD]" @click="homeClose"><span v-html="luci('chevron-left','w-5 h-5')"></span></div>
<div class="flex-1 text-center text-[17px] font-semibold mr-8">告警中心</div>
</div>
<div class="flex-1 overflow-y-auto px-5 pt-4 pb-10 hide-scroll">
<div v-if="allAlerts.length" class="flex flex-col gap-2.5">
<transition-group name="item">
<div class="bg-white border border-[#E5E5E5] rounded-xl overflow-hidden" v-for="(a,i) in allAlerts" :key="a.id" :style="{transitionDelay:i*50+'ms'}">
<div class="flex items-center gap-3 px-4 py-3.5">
<div class="w-9 h-9 rounded-[10px] flex items-center justify-center shrink-0" :class="lvBg(a.lv)">
<span v-html="luci(a.icon,'w-[18px] h-[18px]')"></span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-semibold">{{ a.vin }}</span>
<span class="text-[11px] font-semibold px-2 py-0.5 rounded-[4px]" :class="lvBg(a.lv)">{{ a.type }}</span>
</div>
<div class="text-xs text-[#999]">告警时间：{{ a.time }}</div>
</div>
</div>
</div>
</transition-group>
</div>
<div v-else class="flex flex-col items-center py-16">
<div class="w-14 h-14 rounded-full bg-[#ECFDF3] flex items-center justify-center mb-3"><span v-html="luci('shield-check','w-7 h-7 text-[#17A34A]')"></span></div>
<div class="text-[15px] font-semibold text-[#111] mb-1">暂无告警</div>
<div class="text-[13px] text-[#999]">所有车辆运营正常</div>
</div>
</div>
</div>
</transition>
<transition name="sl">
<div v-if="homeOV==='messages'" v-swipe-close="homeClose" class="absolute inset-0 bg-[#F6F7F9] z-[500] flex flex-col">
<div class="flex items-center pt-14 px-4 pb-3 bg-white shrink-0" style="border-bottom:1px solid #E5E5E5">
<div class="w-8 h-8 rounded-full flex items-center justify-center cursor-pointer text-[#2F6FEB] active:bg-[#EBF1FD]" @click="homeClose"><span v-html="luci('chevron-left','w-5 h-5')"></span></div>
<div class="flex-1 text-center text-[17px] font-semibold mr-8">消息中心</div>
</div>
<div class="flex-1 overflow-y-auto px-5 pt-4 pb-10 hide-scroll">
<div v-if="msgs.length" class="bg-white border border-[#E5E5E5] rounded-xl overflow-hidden">
<transition-group name="item">
<div class="flex items-center px-4 py-3.5 border-b border-[#E5E5E5] last:border-b-0 gap-3 cursor-pointer active:bg-[#F6F7F9]" v-for="(m,i) in msgs" :key="m.id" :style="{transitionDelay:i*60+'ms'}" @click="readMsg(m)">
<span class="w-2 h-2 rounded-full shrink-0" :class="m.read?'bg-transparent border border-[#E5E5E5]':'bg-[#2F6FEB]'"></span>
<div class="flex-1 min-w-0">
<div class="text-sm font-semibold mb-[3px]">{{ m.title }}</div>
<div class="text-xs text-[#6B6B6B] truncate">{{ m.desc }}</div>
</div>
<span class="text-[11px] text-[#999] shrink-0">{{ m.time }}</span>
</div>
</transition-group>
</div>
<div v-else class="flex flex-col items-center py-16">
<div class="w-14 h-14 rounded-full bg-[#EBF1FD] flex items-center justify-center mb-3"><span v-html="luci('inbox','w-7 h-7 text-[#2F6FEB]')"></span></div>
<div class="text-[15px] font-semibold text-[#111] mb-1">暂无消息</div>
<div class="text-[13px] text-[#999]">新消息将在此处通知</div>
</div>
</div>
</div>
</transition>
</template>

<!-- ═══ VEHICLES ═══ -->
<template v-if="tab==='vehicles'">
<template v-if="!vehOV">
<div class="pt-14 px-5 pb-2 bg-white shrink-0">
<div class="flex gap-2 items-center">
<div class="flex-1 rounded-full flex items-center py-1.5 gap-1.5" style="background:#F6F7F9;border:1px solid #E5E5E5;padding-left:14px;padding-right:4px">
<span v-html="luci('search','w-4 h-4 text-[#999] shrink-0')"></span>
<input v-model="vehQ" type="text" placeholder="搜索车架号" class="flex-1 bg-transparent border-none text-sm outline-none min-w-0 placeholder:text-[#999]" @keyup.enter="vehDoSearch">
<div @click="vehDoSearch" class="h-8 px-3 bg-[#2F6FEB] text-white rounded-full flex items-center justify-center cursor-pointer shrink-0 text-xs font-semibold">搜索</div>
</div>
<div @click="vehOpenFS" class="w-10 h-10 rounded-full flex items-center justify-center cursor-pointer shrink-0" :style="vehHasF?{background:'#EBF1FD',border:'1px solid #2F6FEB',color:'#2F6FEB'}:{background:'#fff',border:'1px solid #E5E5E5',color:'#666'}">
<span v-html="luci('sliders-horizontal','w-4 h-4')"></span>
</div>
</div>
</div>
<div class="bg-white shrink-0" style="padding:12px 20px;border-bottom:1px solid #E5E5E5">
<div class="filter-tabs" id="vehiclePillRow">
<div v-for="p in pills" :key="p.v" @click="vehPill=p.v" class="filter-pill" :style="vehPill===p.v?{background:'#2F6FEB',color:'#fff',border:'1px solid #2F6FEB'}:{background:'#fff',color:'#666',border:'1px solid #E5E5E5'}">{{ p.l }} ({{ pillCnt[p.v] }})</div>
</div>
</div>
<div class="ptr-indicator" id="ptr-veh"><span class="ptr-text">下拉刷新</span></div>
<div id="sc-veh" class="flex-1 overflow-y-auto min-h-0 px-5 pt-3 pb-24 hide-scroll" style="touch-action:pan-y;-webkit-overflow-scrolling:touch">
<template v-if="vehLoading">
<div v-for="n in 3" :key="'sk-'+n" class="bg-white rounded-xl p-4 mb-2.5" style="border:1px solid #E5E5E5">
<div class="skeleton h-4 rounded w-28 mb-3"></div>
<div class="flex justify-between items-center mb-2">
<div class="skeleton h-3.5 rounded w-24"></div>
<div class="flex gap-2"><div class="skeleton h-3.5 rounded w-10"></div><div class="skeleton h-3.5 rounded w-10"></div></div>
</div>
<div class="flex justify-between">
<div class="flex gap-3"><div class="skeleton h-3 rounded w-12"></div><div class="skeleton h-3 rounded w-12"></div></div>
<div class="skeleton h-3 rounded w-28"></div>
</div>
</div>
</template>
<template v-else-if="filtered.length">
<div v-for="v in filtered" :key="v.vin" @click="vehOpenDetail(v)" class="bg-white rounded-xl p-4 mb-2.5 cursor-pointer active:bg-[#F6F7F9]" style="border:1px solid #E5E5E5;box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)">
<div class="text-[15px] font-semibold mb-1.5">车架号：{{ v.vin }}</div>
<div class="flex justify-between items-center text-[13px] mb-1.5">
<span>中控编号：{{ v.ctrl }}</span>
<div class="flex gap-3">
<span class="flex items-center gap-1 text-[12px]" :style="{color:v.online?'#17A34A':'#D97706'}"><span class="w-1.5 h-1.5 rounded-full" :style="{background:v.online?'#17A34A':'#D97706'}"></span>{{ v.online?'在线':'离线' }}</span>
<span class="flex items-center gap-1 text-[12px]" :style="{color:sc(v.status)}"><span class="w-1.5 h-1.5 rounded-full" :style="{background:sc(v.status)}"></span>{{ v.status }}</span>
</div>
</div>
<div class="flex justify-between items-center">
<div class="flex gap-3 text-[12px]">
<span class="flex items-center gap-1" :style="{color:bc(v.batteryMain)}"><span v-html="luci(bi(v.batteryMain),'w-3 h-3')"></span>{{ v.batteryMain }}%</span>
<span class="flex items-center gap-1" :style="{color:bc(v.batterySub)}"><span v-html="luci(bi(v.batterySub),'w-3 h-3')"></span>{{ v.batterySub }}%</span>
</div>
<span class="text-[11px] text-[#999]">最后信号时间：{{ v.time }}</span>
</div>
</div>
</template>
<div v-else class="flex flex-col items-center justify-center py-16">
<div class="w-16 h-16 rounded-full bg-[#EBF1FD] flex items-center justify-center mb-4">
<span v-html="luci('bike','w-8 h-8 text-[#2F6FEB]')"></span>
</div>
<div class="text-[15px] font-semibold text-[#111] mb-1">暂无车辆</div>
<div class="text-[13px] text-[#999] mb-4">{{ vehQ||vehHasF ? '未找到匹配的车辆，请调整搜索条件' : '点击右下角 + 添加第一辆车辆' }}</div>
<div v-if="vehQ||vehHasF" @click="vehQ='';vehResetFS()" class="px-4 py-2 rounded-full text-[13px] font-medium cursor-pointer active:opacity-70" style="background:#EBF1FD;color:#2F6FEB;border:1px solid #2F6FEB">清除筛选</div>
</div>
</div>
<div @click="vehOV='add'" class="absolute bottom-[105px] right-5 w-14 h-14 bg-[#2F6FEB] text-white rounded-full flex items-center justify-center cursor-pointer z-[80] active:scale-95 transition-transform" style="box-shadow:0 4px 12px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.12)"><span v-html="luci('plus','w-5 h-5')"></span></div>
</template>

<!-- ═══ VEHICLE DETAIL ═══ -->
<transition name="sl">
<div v-if="vehOV==='detail'" v-swipe-close="()=>vehOV=null" class="absolute inset-0 bg-[#F6F7F9] z-[500] flex flex-col">
<div class="flex items-center pt-14 px-4 pb-3 bg-white shrink-0" style="border-bottom:1px solid #E5E5E5">

<template v-if="ordersLoading">
<div v-for="n in 4" :key="'sk'+n" class="bg-white rounded-xl p-4 mb-2.5" style="border:1px solid #E5E5E5">
<div class="flex justify-between items-center mb-2"><div class="sk h-3.5 rounded w-28"></div><div class="sk h-5 rounded w-12"></div></div>
<div class="flex justify-between items-center mb-1.5"><div class="sk h-3 rounded w-24"></div><div class="sk h-5 rounded w-16"></div></div>
<div class="flex justify-between items-center mb-2"><div class="sk h-3 rounded w-32"></div><div class="sk h-3 rounded w-12"></div></div>
<div class="sk h-3 rounded w-40"></div>
</div>
</template>
<template v-else-if="oFiltered.length">
<div v-for="(o,i) in oFiltered" :key="o.id" @click="ordersOpenDetail(o)" class="bg-white rounded-xl p-4 mb-2.5 cursor-pointer active:bg-[#F6F7F9]" :style="{border:'1px solid #E5E5E5',boxShadow:'0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)',transitionDelay:i*50+'ms',opacity:o.status==='cancelled'?0.6:1}">
<div class="flex justify-between items-center mb-2"><span class="text-[13px] font-semibold">{{ o.id }}</span><span class="text-[11px] font-semibold px-2 py-0.5 rounded" :style="stg(o.status)">{{ sl(o.status) }}</span></div>
<div v-if="hasVehicle(o.status)" class="flex justify-between items-center text-[12px] mb-1"><span class="text-[#666]">{{ o.vin }}</span><span class="text-[18px] font-bold">¥{{ o.amount }}</span></div>
<div v-else class="flex justify-end items-center text-[12px] mb-1"><span class="text-[18px] font-bold">¥{{ o.amount }}</span></div>
<div class="flex justify-between items-center text-[12px] mb-2"><span class="text-[#666]">{{ o.customer }} {{ o.phone }}</span><span class="text-[#999]">{{ o.plan }}</span></div>
<div class="text-[11px] text-[#999]">{{ o.time }}</div>
</div>
</template>
<div v-else class="flex flex-col items-center justify-center py-16">
<div class="w-16 h-16 rounded-full bg-[#EBF1FD] flex items-center justify-center mb-4"><span v-html="luci('file-text','w-8 h-8 text-[#2F6FEB]')"></span></div>
<div class="text-[15px] font-semibold text-[#111] mb-1">暂无订单</div>
<div class="text-[13px] text-[#999] mb-4">{{ ordersQ||ordersHasF ? '未找到匹配的订单，请调整搜索条件' : '还没有订单记录' }}</div>
<div v-if="ordersQ||ordersHasF" @click="ordersQ='';ordersResetFS()" class="px-4 py-2 rounded-full text-[13px] font-medium cursor-pointer active:opacity-70" style="background:#EBF1FD;color:#2F6FEB;border:1px solid #2F6FEB">清除筛选</div>
</div>
</div>
</template>
<transition name="sl"><div v-if="ordersOV==='detail'" v-swipe-close="()=>ordersOV=null" class="absolute inset-0 bg-[#F6F7F9] z-[500] flex flex-col">
<div class="flex items-center pt-14 px-4 pb-3 bg-white shrink-0" style="border-bottom:1px solid #E5E5E5">
<div class="w-8 h-8 rounded-full flex items-center justify-center cursor-pointer text-[#2F6FEB] active:bg-[#EBF1FD]" @click="ordersOV=null"><span v-html="luci('chevron-left','w-5 h-5')"></span></div>
<div class="flex-1 text-center text-[17px] font-semibold mr-8">订单详情</div>
<span class="text-[14px] font-medium cursor-pointer shrink-0" :style="refundable?{color:'#2F6FEB'}:{color:'#999',pointerEvents:'none'}" @click="refundable&&toast('正在跳转退款记录页…','info')">退款记录</span>
</div>
<div class="flex-1 overflow-y-auto px-5 pt-4 pb-32 hid" style="touch-action:pan-y">
<div class="flex flex-wrap gap-1.5 mb-3"><div v-for="s in allStatus" :key="s.v" @click="dSt=s.v" class="px-2.5 py-1 rounded-xl text-[11px] cursor-pointer transition-all" :style="dSt===s.v?{background:'#2F6FEB',color:'#fff',border:'1px solid #2F6FEB'}:{background:'#fff',color:'#666',border:'1px solid #E5E5E5'}">{{ s.l }}</div></div>
<div v-if="dSt==='pendingPay'" class="flex items-center gap-1.5 mb-3"><span class="text-[11px] text-[#999] mr-1">支付方式：</span><div @click="dPm='online'" class="px-2.5 py-1 rounded-xl text-[11px] cursor-pointer transition-all" :style="dPm==='online'?{background:'#FFFBEB',color:'#F59E0B',border:'1px solid #F59E0B'}:{background:'#fff',color:'#666',border:'1px solid #E5E5E5'}">线上支付</div><div @click="dPm='offline'" class="px-2.5 py-1 rounded-xl text-[11px] cursor-pointer transition-all" :style="dPm==='offline'?{background:'#FFFBEB',color:'#F59E0B',border:'1px solid #F59E0B'}:{background:'#fff',color:'#666',border:'1px solid #E5E5E5'}">线下支付</div></div>
<div class="bg-white rounded-xl p-4 mb-3" style="border:1px solid #E5E5E5;box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)">
<div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">订单编号</span><span class="flex items-center text-[14px] font-semibold">{{ do_.id }}<span v-html="luci('copy','w-4 h-4 ml-1.5 text-[#999] cursor-pointer active:text-[#2F6FEB]')" @click="copyId"></span></span></div>
<div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">用户信息</span><span class="flex items-center"><span class="text-[14px] font-semibold">{{ do_.customer }} {{ do_.phone }}</span><div @click.stop="toast('正在呼叫 '+do_.customer+'…','info')" class="w-7 h-7 rounded-full bg-[#EBF1FD] flex items-center justify-center ml-2 cursor-pointer text-[#2F6FEB] shrink-0 active:bg-[#2F6FEB] active:text-white"><span v-html="luci('phone','w-3.5 h-3.5')"></span></div></span></div>
<div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">开始时间</span><span class="text-[14px] font-semibold">2025-01-18 14:00:00</span></div>
<div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">结束时间</span><span class="text-[14px] font-semibold">2025-01-20 14:00:00</span></div>
<div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">租车方案</span><span class="text-[14px] font-semibold">{{ do_.plan }}</span></div>
<div class="flex justify-between items-center py-2.5"><span class="text-[12px] text-[#999]">当前状态</span><span class="text-[11px] font-semibold px-2.5 py-0.5 rounded" :style="stg(dSt)">{{ sl(dSt) }}</span></div>
</div>
<div class="bg-white rounded-xl p-4 mb-3" style="border:1px solid #E5E5E5;box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)">
<div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">租金</span><span class="text-[14px] font-semibold">¥{{ do_.amount }}</span></div>
<div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">押金</span><span class="text-[14px] font-semibold">¥500</span></div>
<template v-if="showPaid"><div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">实付金额</span><span class="text-[14px] font-bold text-[#17A34A]">¥{{ do_.amount+500 }}</span></div><div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">支付方式</span><span class="text-[14px] font-semibold">微信支付</span></div><div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">支付时间</span><span class="text-[14px] font-semibold">2025-01-18 13:30:00</span></div></template>
<template v-if="dSt==='pendingPay'"><div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">支付方式</span><span class="text-[14px] font-semibold">{{ dPm==='offline'?'线下支付':'微信支付' }}</span></div></template>
<template v-if="dSt==='complete'"><div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">押金退还</span><span class="text-[14px] font-bold text-[#17A34A]">¥500</span></div><div class="flex justify-between items-center py-2.5" style="border-bottom:1px dashed #E5E5E5"><span class="text-[12px] text-[#999]">退还时间</span><span class="text-[14px] font-semibold">2025-03-10 09:05:00</span></div></template>
</div>
<div v-if="showVehicle" @click="toast('正在跳转车辆详情…','info')" class="bg-white rounded-xl p-4 mb-3 flex items-center cursor-pointer active:bg-[#F6F7F9]" style="border:1px solid #E5E5E5;box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)">
<div class="w-10 h-10 rounded-xl bg-[#EBF1FD] flex items-center justify-center mr-3 shrink-0"><span v-html="luci('bike','w-6 h-6 text-[#2F6FEB]')"></span></div>
<div class="flex-1 min-w-0"><div class="text-[13px] font-semibold mb-0.5">车架号：{{ do_.vin }}</div><div class="text-[12px] text-[#666] flex items-center gap-1">{{ do_.model }} <span class="w-1.5 h-1.5 rounded-full bg-[#17A34A]"></span> 在线</div></div>
<span v-html="luci('chevron-right','w-4 h-4 text-[#999] shrink-0')"></span>
</div>

<!-- ═══ 客户补充资料 · 入口卡片 ═══ -->
<div v-if="showDocCard" @click="openDocsPage" class="bg-white rounded-xl p-4 mb-3 flex items-center cursor-pointer active:bg-[#F6F7F9]" style="border:1px solid #E5E5E5;box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)">
<div class="w-10 h-10 rounded-full bg-[#EBF1FD] flex items-center justify-center mr-3 shrink-0"><span v-html="luci('folder-open','w-5 h-5 text-[#2F6FEB]')"></span></div>
<div class="flex-1 min-w-0">
<div class="text-[14px] font-semibold">客户补充资料</div>
<div class="text-[12px] text-[#999] mt-0.5">{{ curDocs.length ? curDocs.length+' 份资料' : '暂无补充资料' }}</div>
</div>
<span v-html="luci('chevron-right','w-4 h-4 text-[#999] shrink-0')"></span>
</div>

</div>
<div v-if="showActions" class="absolute bottom-0 left-0 right-0 px-5 pb-7 pt-3 z-[10]" style="background:rgba(246,247,249,.95);backdrop-filter:blur(10px)">
<div class="flex gap-3">
<button @click="ordersDoPrimary" :disabled="ordersSaving" class="flex-1 py-3.5 rounded-xl text-[15px] font-semibold text-white border-none cursor-pointer disabled:opacity-50 transition-colors" :style="primaryDanger?{background:'#DC2626'}:{background:'#2F6FEB'}">{{ primaryLabel }}</button>
<button v-if="dualMode" @click="ordersDoDanger" :disabled="ordersSaving" class="flex-1 py-3.5 rounded-xl text-[15px] font-semibold border-none cursor-pointer disabled:opacity-50 transition-colors" :style="dualIsCancel?{background:'#E5E5E5',color:'#111'}:{background:'#DC2626',color:'#fff'}">{{ dangerLabel }}</button>
</div></div>
</div></transition>

<!-- ═══ ORDER DOCS SUB-PAGE ═══ -->
<transition name="sl">
<div v-if="ordersOV==='docs'" v-swipe-close="()=>ordersOV='detail'" class="absolute inset-0 bg-[#F6F7F9] z-[510] flex flex-col">
<div class="flex items-center pt-14 px-4 pb-3 bg-white shrink-0" style="border-bottom:1px solid #E5E5E5">
<div class="w-8 h-8 rounded-full flex items-center justify-center cursor-pointer text-[#2F6FEB] active:bg-[#EBF1FD]" @click="ordersOV='detail'"><span v-html="luci('chevron-left','w-5 h-5')"></span></div>
<div class="flex-1 text-center text-[17px] font-semibold mr-8">客户补充资料</div>
</div>
<div class="flex-1 overflow-y-auto px-5 pt-4 pb-24 hid">
<template v-if="!curDocs.length">
<div class="flex flex-col items-center py-16">
<div class="w-14 h-14 rounded-full bg-[#F6F7F9] flex items-center justify-center mb-3"><span v-html="luci('file-plus','w-7 h-7 text-[#999]')"></span></div>
<div class="text-[15px] font-semibold text-[#111] mb-1">暂无补充资料</div>
<div class="text-[13px] text-[#999]">{{ canEditDocs ? '点击下方按钮添加客户资料' : '当前状态仅支持查看' }}</div>
</div>
</template>
<template v-else>
<div class="flex flex-col gap-2.5">
<div v-for="doc in curDocs" :key="doc.id" class="bg-white rounded-xl p-4 flex items-start gap-3" style="border:1px solid #E5E5E5;box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)">
<template v-if="doc.type==='image'">
<div class="w-12 h-12 rounded-lg shrink-0 flex items-center justify-center text-[10px] font-semibold" :style="{background:doc.color+'15',color:doc.color,border:'1px solid '+doc.color+'30'}">{{ doc.label }}</div>
<div class="flex-1 min-w-0 cursor-pointer" @click="previewImage=doc">
<div class="text-[14px] font-semibold mb-1">{{ doc.label }}</div>
<div class="text-[12px] text-[#999]">{{ doc.time }}</div>
</div>
</template>
<template v-else>
<div class="flex-1 min-w-0 p-3 rounded-lg" style="background:#F6F7F9;border:1px solid #E5E5E5">
<div class="text-[14px] leading-relaxed mb-1.5">{{ doc.content }}</div>
<div class="text-[12px] text-[#999]">{{ doc.time }}</div>
</div>
</template>
<div v-if="canEditDocs" @click.stop="deleteDoc(doc.id)" class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 cursor-pointer active:opacity-80 ml-auto" style="background:#FEE2E2;color:#DC2626"><span v-html="luci('trash-2','w-3.5 h-3.5')"></span></div>
</div>
</div>
</template>
</div>
<div class="absolute bottom-7 left-5 right-5">
<button v-if="canEditDocs" @click="openDocSheet" class="w-full py-4 rounded-xl text-[16px] font-semibold text-white border-none cursor-pointer transition-colors" style="background:#2F6FEB">添加资料</button>
</div>
</div>
</transition>

<transition name="fd"><div v-if="showRefund" class="absolute inset-0 z-[900]" style="background:rgba(0,0,0,.5)" @click="showRefund=false"></div></transition>
<transition name="sh"><div v-if="showRefund" class="absolute bottom-0 left-0 right-0 bg-white z-[901] rounded-t-[20px] max-h-[92%] flex flex-col">
<div class="w-9 h-[5px] mx-auto mt-3 mb-2" style="background:#CCC;border-radius:3px"></div>
<div class="text-center text-[18px] font-bold pb-4 px-5 shrink-0">{{ refundMode==='return'?'归还车辆':'退款' }}</div>
<div class="flex-1 overflow-y-auto px-5 hid" style="max-height:45vh">
<div class="mb-6"><div class="text-[14px] font-semibold mb-2">租金退款</div><div class="flex items-center rounded-xl overflow-hidden transition-colors" :style="rRentErr?{border:'1px solid #DC2626',background:'#FEF2F2'}:{border:'1px solid #E5E5E5'}"><span class="pl-4 text-[16px] font-semibold shrink-0">¥</span><input v-model.number="rRent" type="number" min="0" max="800" placeholder="0" class="flex-1 bg-transparent border-none text-[16px] font-medium outline-none px-2 py-3.5" @input="clampRent"></div><div class="text-[12px] text-[#999] mt-1">可退上限 ¥800.00</div></div>
<div class="mb-6"><div class="text-[14px] font-semibold mb-2">押金退款</div><div class="flex items-center rounded-xl overflow-hidden transition-colors" :style="rDepErr?{border:'1px solid #DC2626',background:'#FEF2F2'}:{border:'1px solid #E5E5E5'}"><span class="pl-4 text-[16px] font-semibold shrink-0">¥</span><input v-model.number="rDep" type="number" min="0" max="500" placeholder="0" class="flex-1 bg-transparent border-none text-[16px] font-medium outline-none px-2 py-3.5" @input="clampDep"></div><div class="text-[12px] text-[#999] mt-1">可退上限 ¥500.00</div></div>
<div class="mb-4"><div class="text-[14px] font-semibold mb-2">退款原因 <span class="font-normal text-[#999]">（选填）</span></div><textarea v-model="rReason" placeholder="请输入退款原因..." class="w-full p-4 rounded-xl text-[15px] outline-none resize-none min-h-[90px] transition-colors" style="border:1px solid #E5E5E5;font-family:inherit"></textarea></div>
</div>
<div class="px-5 pb-8 shrink-0"><div class="flex justify-between items-center py-3" style="border-top:1px solid #E5E5E5"><span class="text-[16px] font-semibold">合计退款</span><span class="text-[22px] font-bold text-[#17A34A]">¥{{ refundTotal.toFixed(2) }}</span></div><button @click="submitRefund" :disabled="refundSaving" class="w-full py-4 rounded-xl text-[17px] font-bold text-white border-none cursor-pointer disabled:opacity-50 transition-colors" style="background:#17A34A">{{ refundMode==='return'?'确认归还':'确认退款' }}</button></div>
</div></transition>

<!-- ═══ ADD DOC SHEET ═══ -->
<transition name="fd"><div v-if="showDocSheet" class="absolute inset-0 z-[604]" style="background:rgba(0,0,0,.35)" @click="showDocSheet=false"></div></transition>
<transition name="sh">
<div v-if="showDocSheet" class="absolute bottom-0 left-0 right-0 bg-white z-[605] rounded-t-[20px] flex flex-col" style="max-height:70%">
<div class="w-9 h-[5px] mx-auto mt-2.5 mb-1" style="background:#CCC;border-radius:3px"></div>
<div class="text-center text-[17px] font-semibold py-3 px-5 shrink-0">添加补充资料</div>
<div class="flex mx-5 mb-3 shrink-0 rounded-full p-0.5" style="background:#F6F7F9;border:1px solid #E5E5E5">
<div @click="docSheetTab='image'" class="flex-1 py-2 rounded-full text-[13px] font-medium text-center cursor-pointer transition-all" :style="docSheetTab==='image'?{background:'#fff',color:'#111',boxShadow:'0 1px 3px rgba(0,0,0,.06)'}:{color:'#999'}">拍照上传</div>
<div @click="docSheetTab='text'" class="flex-1 py-2 rounded-full text-[13px] font-medium text-center cursor-pointer transition-all" :style="docSheetTab==='text'?{background:'#fff',color:'#111',boxShadow:'0 1px 3px rgba(0,0,0,.06)'}:{color:'#999'}">文字备注</div>
</div>
<div class="flex-1 overflow-y-auto px-5 pb-8">
<template v-if="docSheetTab==='image'">
<div class="grid grid-cols-2 gap-2.5">
<div v-for="img in docImageTypes" :key="img.label" @click="addDocImage(img)" class="flex flex-col items-center justify-center py-5 rounded-xl cursor-pointer active:bg-[#F6F7F9] transition-colors" style="border:2px dashed #E5E5E5">
<div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" :style="{background:img.color+'15'}"><span v-html="luci(img.icon,'w-5 h-5')" :style="{color:img.color}"></span></div>
<span class="text-[13px] font-medium">{{ img.label }}</span>
</div>
</div>
</template>
<template v-else>
<textarea v-model="docText" placeholder="请输入备注内容..." class="w-full p-4 rounded-xl text-[15px] outline-none resize-none min-h-[120px]" style="border:1px solid #E5E5E5;font-family:inherit"></textarea>
<div @click="addDocText" class="mt-3 w-full py-3 rounded-xl text-[15px] font-semibold text-white text-center cursor-pointer transition-colors" :style="docText.trim()?{background:'#2F6FEB'}:{background:'#E0E0E0',color:'#999',pointerEvents:'none'}">确认添加</div>
</template>
</div>
</div>
</transition>

<!-- ═══ DOC DELETE CONFIRMATION ═══ -->
<transition name="fd"><div v-if="docDeleteMod" class="absolute inset-0 z-[800]" style="background:rgba(0,0,0,.45)" @click="docDeleteMod=false"></div></transition>
<transition name="fd">
<div v-if="docDeleteMod" class="absolute inset-0 z-[801] flex items-center justify-center pointer-events-none">
<div class="bg-white rounded-xl w-[300px] px-5 pt-6 pb-4 flex flex-col gap-3 pointer-events-auto" style="box-shadow:0 4px 12px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.12)">
<div class="text-[17px] font-bold text-center">确认删除</div>
<div class="text-[14px] text-[#666] text-center leading-relaxed">确定要删除该资料吗？删除后不可恢复。</div>
<div class="flex gap-3 mt-2">
<div @click="docDeleteMod=false" class="flex-1 py-3 rounded-xl text-[15px] font-medium text-center cursor-pointer active:bg-[#F6F7F9] transition-colors" style="border:1px solid #E5E5E5;background:#fff">取消</div>
<div @click="confirmDeleteDoc" class="flex-1 py-3 rounded-xl text-white text-[15px] font-semibold text-center cursor-pointer active:opacity-80 transition-colors" style="background:#DC2626">确认删除</div>
</div>
</div>
</div>
</transition>

<!-- ═══ IMAGE PREVIEW OVERLAY ═══ -->
<transition name="fd">
<div v-if="previewImage" class="absolute inset-0 z-[700] flex flex-col items-center justify-center gap-5" style="background:rgba(0,0,0,.88)" @click="previewImage=null">
<div class="w-40 h-40 rounded-2xl flex items-center justify-center" :style="{background:previewImage.color+'20',border:'2px solid '+previewImage.color+'50'}">
<span v-html="luci('image','w-20 h-20')" :style="{color:previewImage.color}"></span>
</div>
<div class="text-white text-[18px] font-bold">{{ previewImage.label }}</div>
<div class="text-white/40 text-[13px] -mt-3">{{ previewImage.time }}</div>
<div class="text-white/30 text-[13px] mt-2">轻触任意位置关闭</div>
</div>
</transition>

<!-- ═══ FILTER SHEET ═══ -->
